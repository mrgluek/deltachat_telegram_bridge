name: Notify TG Bridge Changelog
on: [push]

jobs:
  notify:
    runs-on: ubuntu-latest
    container:
      image: curlimages/curl:latest
    steps:
      - name: Send notification
        run: |
          curl -H "Title: ${{ github.event.head_commit.message }}" \
               -H "Tags: robot,bridge" \
               -d "Author: ${{ github.actor }}
               Link: ${{ github.event.head_commit.url }}" \
               https://ntfy.gluek.info/telegram_bridge_changelog

      - name: Trigger Home Assistant Add-ons Sync
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            curl -sSL -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $SYNC_TOKEN" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 https://api.github.com/repos/mrgluek/hass-addons-deltachat/dispatches \
                 -d '{"event_type":"bot-updated","client_payload":{"addon":"telegram_bridge"}}'
            echo "Successfully dispatched bot-updated for telegram_bridge"
          else
            echo "SYNC_TOKEN secret not configured, skipping dispatch"
          fi
