name: Release

# Pushing a version tag (git tag -a v2.31.0 -m ... && git push origin v2.31.0)
# publishes the GitHub release with that version's CHANGELOG.md section, then
# tells ntfy and the Home Assistant add-on repository. update.sh on the server
# deploys the newest v* tag, so a tag is what ships, not a push to master.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version and take the notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! grep -qx "VERSION = \"$VERSION\"" dc_commands.py; then
            echo "::error::dc_commands.py has $(grep '^VERSION' dc_commands.py), not $VERSION"
            exit 1
          fi
          # the "## [X.Y.Z] - date" section up to the next "## ["
          awk -v head="## [$VERSION]" '
            index($0, "## [") == 1 { if (found) exit; found = (index($0, head) == 1); next }
            found' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section ## [$VERSION]"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it as it is."
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  notify:
    needs: release
    runs-on: ubuntu-latest
    container:
      image: curlimages/curl:latest
    steps:
      - name: Send notification
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$MESSAGE" | head -n 1)
          curl -H "Title: $SUBJECT" \
               -H "Tags: robot,bridge" \
               -d "Author: ${{ github.actor }}
               Link: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}" \
               https://ntfy.gluek.info/telegram_bridge_changelog

      - name: Trigger Home Assistant Add-ons Sync
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -n "$SYNC_TOKEN" ]; then
            curl -sSL -X POST \
                 -H "Accept: application/vnd.github+json" \
                 -H "Authorization: Bearer $SYNC_TOKEN" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 https://api.github.com/repos/mrgluek/hass-addons-deltachat/dispatches \
                 -d '{"event_type":"bot-updated","client_payload":{"addon":"telegram_bridge","version":"${{ github.ref_name }}"}}'
            echo "Successfully dispatched bot-updated for telegram_bridge"
          else
            echo "SYNC_TOKEN secret not configured, skipping dispatch"
          fi
